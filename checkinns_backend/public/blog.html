<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Insights - Check-Inns Blog</title>
    <link rel="stylesheet" href="checkinns3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f2c;
            --accent: #9e8bff;
            --accent2: #68d4ff;
        }

        body {
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .blog-hero {
            height: 400px;
            background: linear-gradient(rgba(11, 15, 44, 0.7), rgba(11, 15, 44, 0.9)), url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .blog-hero h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .blog-container {
            max-width: 1200px;
            margin: -50px auto 50px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .blog-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(158, 139, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .blog-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(158, 139, 255, 0.2);
        }

        .blog-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .blog-content {
            padding: 25px;
        }

        .blog-tag {
            background: rgba(104, 212, 255, 0.2);
            color: var(--accent2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: inline-block;
        }

        .blog-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
            text-decoration: none;
            display: block;
        }

        .blog-excerpt {
            color: #cfd2ff;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .blog-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #9aa0c3;
        }

        .read-more {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .read-more:hover {
            gap: 10px;
        }

        nav {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            width: 100%;
            box-sizing: border-box;
            z-index: 10;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav>
        <a href="checkinns3.html" class="logo">CheckInns</a>
        <div class="nav-links">
            <a href="checkinns3.html" style="color: #fff; text-decoration: none; font-weight: 600;">Home</a>
        </div>
    </nav>

    <header class="blog-hero">
        <h1>Travel Insights</h1>
        <p style="color: #cfd2ff; font-size: 1.2rem;">Discover your next adventure with CheckInns</p>
    </header>

    <div class="blog-container" id="blog-grid">
        <!-- Blogs will be loaded here -->
        <div style="text-align: center; grid-column: 1/-1; padding: 50px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent);"></i>
            <p>Loading stories...</p>
        </div>
    </div>

    <script>
        async function loadBlogs() {
            try {
                const res = await fetch('/api/blogs');
                const blogs = await res.json();
                const grid = document.getElementById('blog-grid');
                grid.innerHTML = '';

                if (blogs.length === 0) {
                    grid.innerHTML = '<div style="text-align:center; grid-column:1/-1;"><h3>No blog posts yet. Stay tuned!</h3></div>';
                    return;
                }

                blogs.forEach(blog => {
                    const card = document.createElement('div');
                    card.className = 'blog-card';
                    card.innerHTML = `
                        <img src="${blog.mainImage || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80'}" class="blog-img" alt="${blog.title}">
                        <div class="blog-content">
                            <span class="blog-tag">${blog.tags?.[0] || 'Travel'}</span>
                            <a href="blog_details.html?slug=${blog.slug}" class="blog-title">${blog.title}</a>
                            <p class="blog-excerpt">${blog.content.substring(0, 120)}...</p>
                            <div class="blog-footer">
                                <span><i class="far fa-calendar"></i> ${new Date(blog.createdAt).toLocaleDateString()}</span>
                                <a href="blog_details.html?slug=${blog.slug}" class="read-more">Read More <i class="fas fa-arrow-right"></i></a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading blogs:", err);
            }
        }

        loadBlogs();
    </script>
</body>
</html>
