<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Registration • Check-Inns</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q4CLRC8PZ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Q4CLRC8PZ3');
  </script>
  <style>
    :root {
      --bg-deep: #05060f;
      --accent-primary: #d4af37;
      --accent-secondary: #9e8bff;
      --glass: rgba(15, 18, 41, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #e8e9ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      color: var(--text);
    }

    .bg-immersive {
      position: fixed;
      inset: 0;
      background: url('owner_login_bg_1778304742320.png') no-repeat center center/cover;
      filter: brightness(0.3) saturate(1.2);
      z-index: -1;
    }

    .registration-shell {
      width: min(550px, 100%);
      background: var(--glass);
      backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      color: #7d84ab;
    }

    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 15px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
    }

    input:focus { border-color: var(--accent-secondary); background: rgba(0, 0, 0, 0.5); }

    .action-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-primary), #b8860b);
      color: #000;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .action-btn:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }

    .otp-section {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: rgba(158, 139, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(158, 139, 255, 0.1);
      text-align: center;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .registration-shell { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-immersive"></div>

  <div class="registration-shell">
    <div class="brand-header">
      <div class="brand-icon"><i class="fas fa-handshake"></i></div>
      <h1>Partner Onboarding</h1>
      <p style="font-size: 0.8rem; color: #9aa0c3;">Join the elite property network</p>
    </div>

    <form id="owner-signup-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Legal Name</label>
          <input type="text" id="owner-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Business ID (Username)</label>
          <input type="text" id="owner-username" placeholder="johndoe_lux" required>
        </div>
        <div class="form-group full">
          <label>Intelligence ID (Email)</label>
          <input type="email" id="owner-email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label>Passphrase</label>
          <input type="password" id="owner-password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Confirm Pass</label>
          <input type="password" id="owner-confirm-password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="action-btn" id="signup-btn">Request OTP Clearance</button>
    </form>

    <div id="otp-section" class="otp-section">
      <p style="margin-bottom: 15px; font-size: 0.9rem;">Clearance code sent to your email.</p>
      <input type="text" id="otp-input" placeholder="Enter 6-Digit Code" style="text-align: center; letter-spacing: 5px; font-weight: bold; margin-bottom: 15px;">
      <button onclick="verifyOTP()" class="action-btn" style="background: var(--accent-secondary); color: #fff;">Verify & Finalize</button>
    </div>

    <p style="text-align: center; margin-top: 25px; font-size: 0.8rem; color: #7d84ab;">
      Already cleared? <a href="owner_login.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Sign In</a>
    </p>
  </div>

  <script>
    let tempOwnerData = null;

    document.getElementById('owner-signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const signupBtn = document.getElementById('signup-btn');
      
      const name = document.getElementById('owner-name').value;
      const username = document.getElementById('owner-username').value;
      const email = document.getElementById('owner-email').value;
      const password = document.getElementById('owner-password').value;
      const confirmPassword = document.getElementById('owner-confirm-password').value;

      if (password !== confirmPassword) return alert("Passwords do not match!");

      signupBtn.disabled = true;
      signupBtn.textContent = "Processing...";

      try {
        const res = await fetch('/api/owner/signup-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
          tempOwnerData = { name, username, email, password };
          document.getElementById('owner-signup-form').style.display = 'none';
          document.getElementById('otp-section').style.display = 'block';
        } else {
          alert(data.msg || "Signup failed");
          signupBtn.disabled = false;
          signupBtn.textContent = "Request OTP Clearance";
        }
      } catch (err) {
        alert("Server Error");
        signupBtn.disabled = false;
      }
    });

    async function verifyOTP() {
      const otp = document.getElementById('otp-input').value;
      try {
        const res = await fetch('/api/owner/verify-signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...tempOwnerData, otp })
        });
        const data = await res.json();
        if (res.ok) {
          alert("Clearance Granted! Redirecting to login...");
          window.location.href = 'owner_login.html';
        } else {
          alert(data.msg || "OTP Verification Failed");
        }
      } catch (err) {
        alert("Verification Error");
      }
    }
  </script>
</body>
</html>
